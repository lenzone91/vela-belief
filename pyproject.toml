[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vela-belief"
version = "0.1.0"
description = "Persistent latent memory benchmarks for partially observable systems"
readme = "README.md"
requires-python = ">=3.11"
# NumPy also supplies the tensor/array bridge initialized by PyTorch.
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
docs = ["sphinx>=8,<9", "matplotlib>=3.9,<4"]

[project.scripts]
vela-belief = "vela_belief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
